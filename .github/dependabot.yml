# Weekly updates. Minor and patch versions are grouped into one PR, because
# they should not break anything and one PR is easier to review than many;
# each major version gets its own PR, so one blocked major never holds back
# the others.
#
# cooldown: only propose versions published at least 14 days ago. A
# compromised release is usually caught and pulled within days. Security
# updates are not delayed by it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    allow:
      - dependency-type: direct
    labels:
      - 'mindless: 📦 dependencies'
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Types for a newer Node would allow APIs that older supported Node
      # versions lack, so @types/node moves to a new major only by hand
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      # TypeScript 7 waits until TypeDoc supports it (issue 30)
      - dependency-name: typescript
        versions:
          - '>=7'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    labels:
      - 'mindless: 📦 dependencies'
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
