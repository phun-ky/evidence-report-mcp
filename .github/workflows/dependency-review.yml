name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Accepted exceptions, decided on issue 3. Both come in through the
          # lint tooling only and never ship. Remove each when a fixed release
          # reaches the tree:
          # GHSA-fc5q-39xc-vjpf: picomatch ReDoS, no patched version exists;
          #   only this repository's own glob patterns reach it.
          # GHSA-238p-pmpm-9mq7: katex, pinned to 0.16 by micromark-extension-math;
          #   linting parses Markdown and never renders math.
          # GHSA-c475-qrg2-pj4r, GHSA-5pm8-86m8-9m6r, GHSA-r4jh-29pc-gfqr:
          #   basic-ftp 5, decided on issue 12. Only through release-it >
          #   proxy-agent > pac-proxy-agent > get-uri, all pinned exactly;
          #   reached only when a proxy auto-config file is fetched over
          #   ftp://, which releases never do. Remove when release-it depends
          #   on proxy-agent 8.0.3 or later (basic-ftp 6.2.4 or later).
          # GHSA-g3hv-75wg-m249: minimatch 10, decided on issue 14. Only
          #   through typedoc, which matches this repository's own entry point
          #   and exclude globs, never outside input. Remove when typedoc
          #   depends on minimatch 11.0.1 or later.
          allow-ghsas:
            GHSA-fc5q-39xc-vjpf, GHSA-238p-pmpm-9mq7, GHSA-c475-qrg2-pj4r,
            GHSA-5pm8-86m8-9m6r, GHSA-r4jh-29pc-gfqr, GHSA-g3hv-75wg-m249
