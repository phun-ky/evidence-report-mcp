name: Check

# No path filter on pull_request: "check" is the required check, so it must
# report on every PR or the PR waits for it forever.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the attribution check walks every commit in the PR
          persist-credentials: false
      # Commits made in GitHub's web editor never run the local hook, so CI
      # runs it over every commit in the pull request
      - name: Check commit messages for AI attribution
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for commit in $(git rev-list "$BASE..$HEAD"); do
            git log -1 --format=%B "$commit" > "$RUNNER_TEMP/message"
            .githooks/commit-msg "$RUNNER_TEMP/message" || { echo "::error::$commit carries AI attribution"; status=1; }
          done
          exit "$status"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test the commit hooks
        run: npm run test:hooks
      - name: Test the README examples check
        run: npm run test:readme
      - name: Check the Best Practices answers
        run: npm run check:bestpractices
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test with coverage
        run: npm run test:ci
      - name: Build
        run: npm run build
      - name: Check the package
        run: npm run check:pack
      - name: Check the API docs
        run: npm run docs:check
      - name: Build the docs site
        run: npm run docs:build
      # Headless Chrome is on the runner image
      - name: Check the docs site
        run: npm run check:site
      - name: Test the docs site checks
        run: npm run test:site

  # The oldest Node in engines. Lint is left out: ESLint 10 needs 22.13.0 or
  # later, and lint only runs in development.
  test-oldest-node:
    name: Test and build on Node 22.12.0
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Check the package
        run: npm run check:pack

  # The one required check: fails when any job above failed, was cancelled or
  # was skipped, so adding a job never needs a ruleset change.
  check:
    name: check
    if: ${{ !cancelled() }}
    needs: [test, test-oldest-node]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail unless every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          if [ -z "$RESULTS" ]; then
            echo "No job results to check." >&2
            exit 1
          fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "A job did not succeed: $result" >&2
              exit 1
            fi
          done
